function sheetPayoff(){
  openSheet(`<h3>Card payoff settings</h3><p class="hint">Until the card is paid off, everything left after bills goes to it, after the buffer if you keep one.</p>
  <form><label style="display:flex;gap:10px;align-items:flex-start;font-size:14px"><input type="checkbox" name="usebuf" id="usebuf" style="width:auto;margin-top:3px" ${S.useBuffer!==false?"checked":""}><span><b>Keep an emergency buffer</b><br><span style="color:var(--muted)">A cash cushion for surprises, filled before extra card payments. Turn off to send that money straight to the card.</span></span></label>
  <div id="bufopts" style="display:flex;flex-direction:column;gap:14px" ${S.useBuffer!==false?"":"hidden"}>
  ${money("target","Buffer target",S.bufferTarget)}
  <div class="field"><span class="flabel">Order</span><div class="chips" id="ord"><button type="button" data-o="buffer" aria-pressed="${S.order!=="card"}">Buffer first, then card</button><button type="button" data-o="card" aria-pressed="${S.order==="card"}">Card first, then buffer</button></div></div></div>
  ${money("keep","Keep free per check while paying off",S.keepFree||0)}<p class="hint" style="margin-top:-8px">Spending money held back from each check. $0 sends everything to the buffer and card.</p>
  ${actions("Save")}</form>`,fd=>{S.bufferTarget=num(fd.get("target"))||S.bufferTarget;S.order=order;S.useBuffer=!!fd.get("usebuf");S.keepFree=num(fd.get("keep"));saveSettings();closeSheet();render();toast("Saved");});
  let order=S.order;const f=$("#sheetroot form");F(f,"usebuf").addEventListener("change",()=>{$("#bufopts").hidden=!F(f,"usebuf").checked;});
  $("#ord").addEventListener("click",e=>{const b=e.target.closest("[data-o]");if(!b)return;order=b.dataset.o;$("#ord").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
}
function sheetCat(id){
  const c=id?S.cats.find(x=>x.id===id):{name:"",limit:0,color:nextSlot(S.cats)};if(!c)return;let color=Number.isInteger(c.color)?c.color:0;
  openSheet(`<h3>${id?"Edit category":"Add category"}</h3><form>
   <div class="field"><label for="name">Name</label><input id="name" name="name" value="${esc(c.name)}" placeholder="Coffee" autocomplete="off" maxlength="40"></div>
   <div class="field"><span class="flabel">Color</span><div class="colorpick" id="cpick">${[1,2,3,4,5,6,7,8,0].map(k=>`<button type="button" data-k="${k}" style="--c:var(--k${k})" aria-pressed="${k===color}" aria-label="${["Gray","Blue","Orange","Aqua","Yellow","Pink","Green","Violet","Red"][k]}"></button>`).join("")}</div>
    <p class="hint">${(()=>{const o=S.cats.filter(x=>x.id!==id&&x.color===color&&color>0);return o.length?`Also used by ${o.map(x=>esc(x.name)).join(", ")}.`:"Each category's color shows in your spending breakdown.";})()}</p></div>
   ${money("limit","Limit per pay period (optional)",c.limit||null)}<p class="hint" style="margin-top:-8px">Leave empty for no limit. You'll see a warning near and over it.</p>
   <p class="err" id="err" hidden style="color:var(--bad);margin:0;font-size:13px"></p>
   ${actions(id?"Save":"Add",id?"Delete":null)}</form>`,fd=>{
    const name=String(fd.get("name")||"").trim();if(!name){const e=$("#err");e.textContent="Give the category a name.";e.hidden=false;return;}
    const nc={id:id||uid(),name,limit:num(fd.get("limit")),color};S.cats=id?S.cats.map(x=>x.id===id?nc:x):[...S.cats,nc];saveSettings();closeSheet();render();toast(id?"Saved":"Category added");},
  act=>{if(act==="del"){S.cats=S.cats.filter(x=>x.id!==id);saveSettings();closeSheet();render();toast("Category deleted. Its purchases show as Uncategorized.");}});
  $("#cpick").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;color=+b.dataset.k;$("#cpick").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    const o=S.cats.filter(x=>x.id!==id&&x.color===color&&color>0);b.closest(".field").querySelector(".hint").textContent=o.length?`Also used by ${o.map(x=>x.name).join(", ")}.`:"Each category's color shows in your spending breakdown.";});
}
function sheetGoal(id){
  const g=id?S.goals.find(x=>x.id===id):{name:"",target:""};if(!g)return;
  openSheet(`<h3>${id?"Edit goal":"Add a savings goal"}</h3><form>
   <div class="field"><label for="name">What are you saving for?</label><input id="name" name="name" value="${esc(g.name)}" placeholder="Vacation" autocomplete="off" maxlength="40"></div>
   ${money("target","Goal amount",g.target===""?null:g.target)}
   <p class="err" id="err" hidden style="color:var(--bad);margin:0;font-size:13px"></p>
   ${actions(id?"Save":"Add",id?"Delete":null)}</form>`,fd=>{
    const name=String(fd.get("name")||"").trim();const target=num(fd.get("target"));const err=m=>{const e=$("#err");e.textContent=m;e.hidden=false;};
    if(!name)return err("Give the goal a name.");if(target<=0)return err("Enter a goal amount above $0.");
    const ng={id:id||uid(),name,target};S.goals=id?S.goals.map(x=>x.id===id?ng:x):[...S.goals,ng];saveSettings();closeSheet();render();toast(id?"Saved":"Goal added");},
  act=>{if(act==="del"){S.goals=S.goals.filter(x=>x.id!==id);const gs={...B.goals};delete gs[id];B.goals=gs;saveSettings();saveBal();closeSheet();render();toast("Goal deleted. Your savings balance didn't change.");}});
}
function sheetGoalAdd(id){
  const g=S.goals.find(x=>x.id===id);if(!g)return;let src="have";const cur=B.goals[id]||0;
  openSheet(`<h3>${esc(g.name)}</h3><p class="hint">${fmt(cur,true)} saved of ${fmt(g.target)}.</p><form>
   ${money("amt","Amount",null,true)}
   <div class="field"><span class="flabel">Where's it from?</span><div class="chips" id="src"><button type="button" data-v="have" aria-pressed="true">Savings I already have</button><button type="button" data-v="new" aria-pressed="false">New money</button><button type="button" data-v="out" aria-pressed="false">Take money out</button></div>
   <p class="hint" id="srch"></p></div>
   <p class="err" id="err" hidden style="color:var(--bad);margin:0;font-size:13px"></p>
   ${actions("Save")}</form>`,fd=>{
    const a=num(fd.get("amt"));if(a<=0){const e=$("#err");e.textContent="Enter an amount above $0.";e.hidden=false;return;}
    const gs={...B.goals};
    if(src==="out"){const take=Math.min(a,cur);gs[id]=r2(cur-take);B.savings=r2(Math.max(0,B.savings-take));logBal("goal",-take,`Took ${fmt(take,true)} out of ${g.name}`);}
    else{gs[id]=r2(cur+a);if(src==="new"){B.savings=r2(B.savings+a);}logBal("goal",a,`Added to ${g.name}${src==="new"?" (new money)":""}`);}
    B.goals=gs;saveBal();closeSheet();render();toast("Goal updated");});
  const hint={have:"Sets aside money already in your savings. Your savings balance stays the same.",new:"Adds new money to this goal and to your savings balance.",out:"Takes money out of this goal and your savings balance, for when you spend it."};
  const u=()=>{$("#srch").textContent=hint[src];};u();
  $("#src").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;src=b.dataset.v;$("#src").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));u();});
}
function applyIncome(x,sg){
  if(x.use==="save"){B.savings=r2(B.savings+sg*x.amount);logBal("income",sg*x.amount,sg>0?`Extra income saved: ${x.note||"income"}`:"Removed extra income");saveBal();}
  if(x.use==="card"){B.card=r2(Math.max(0,B.card-sg*x.amount));logBal("payment",-sg*x.amount,sg>0?`Extra income to card: ${x.note||"income"}`:"Removed extra income payment");saveBal();}
}
function sheetIncome(id){
  let found=null,fi=null;if(id)DATES.forEach((d,i)=>{const x=(per(i).income||[]).find(y=>y.id===id);if(x){found=x;fi=i;}});
  const pay=isPayoff();const x=found||{amount:"",note:"",date:iso(new Date()),use:"spend"};let use=(x.use==="card"&&!pay)?"spend":x.use;
  openSheet(`<h3>${found?"Edit extra income":"Add extra income"}</h3><p class="hint">Money outside your regular paycheck, like a bonus, side job or refund.</p><form>
   ${money("amount","Amount",x.amount===""?null:x.amount,true)}
   <div class="field"><label for="note">From</label><input id="note" name="note" value="${esc(x.note)}" placeholder="Bonus, side job, refund" autocomplete="off"></div>
   <div class="field"><span class="flabel">Use it to</span><div class="chips" id="use"><button type="button" data-v="spend" aria-pressed="${use==="spend"}">Spend it</button><button type="button" data-v="save" aria-pressed="${use==="save"}">Save it</button>${pay?`<button type="button" data-v="card" aria-pressed="${use==="card"}">Pay the card</button>`:""}</div></div>
   <div class="field"><label for="date">Date</label><input id="date" name="date" type="date" value="${x.date}"></div>
   <p class="err" id="err" hidden style="color:var(--bad);margin:0;font-size:13px"></p>
   ${actions(found?"Save":"Add",found?"Delete":null)}</form>`,fd=>{
    const amount=num(fd.get("amount"));if(amount<=0){const e=$("#err");e.textContent="Enter an amount above $0.";e.hidden=false;return;}
    if(found){applyIncome(found,-1);P[pid(fi)]={...per(fi),income:(per(fi).income||[]).filter(y=>y.id!==found.id)};savePer(fi);}
    const date=fd.get("date")||iso(new Date());const ti=idxForDate(fromIso(date));
    const nx={id:found?found.id:uid(),amount,note:String(fd.get("note")||"").trim(),date,use};
    P[pid(ti)]={...per(ti),income:[...(per(ti).income||[]),nx]};applyIncome(nx,1);savePer(ti);closeSheet();render();toast(found?"Saved":`Added ${fmt(amount,true)}. ${USE[use]}.`);},
  act=>{if(act==="del"&&found){applyIncome(found,-1);P[pid(fi)]={...per(fi),income:(per(fi).income||[]).filter(y=>y.id!==found.id)};savePer(fi);closeSheet();render();toast("Deleted");}});
  $("#use").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;use=b.dataset.v;$("#use").querySelectorAll("button").forEach(y=>y.setAttribute("aria-pressed",y===b));});
}
// ---------- export, backup, restore ----------
async function saveFile(name,text,mime){
  try{if(window.claude&&typeof window.claude.use==="function"){const d=await window.claude.use("downloads");
    if(d){await d.save({filename:name,data:text});toast("Saved");return;}}}
  catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("A save is already waiting for you. Finish that one first.");return;}}
  try{const url=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}
  catch(e){toast("Couldn't download the file here. Try opening the app in your browser.");}
}
function exportCsv(){
  const q=v=>{const t=String(v??"");return /[",\n]/.test(t)?`"${t.replace(/"/g,'""')}"`:t;};
  const rows=[];for(const [id,p] of Object.entries(P)){const per_=id.slice(1);
    for(const t of (p.tx||[]))rows.push([t.date,per_,"Spending",catName(t.cat),t.method==="card"?"Credit card":"Debit/cash",-t.amount,t.note]);
    for(const x of (p.income||[]))rows.push([x.date,per_,"Extra income",USE[x.use]||"","",x.amount,x.note]);}
  if(!rows.length){toast("Nothing to export yet. Log some spending first.");return;}
  rows.sort((a,b)=>a[0].localeCompare(b[0]));
  const csv=[["Date","Pay period starting","Type","Category","Paid with","Amount","Note"],...rows].map(r=>r.map(q).join(",")).join("\n");
  saveFile(`budget-spending-${iso(new Date())}.csv`,csv,"text/csv");
}
function backup(){saveFile(`budget-backup-${iso(new Date())}.json`,JSON.stringify({app:"budget-tracker",version:2,exported:new Date().toISOString(),settings:S,balances:B,periods:P},null,1),"application/json");}
function sheetRestore(){
  openSheet(`<h3>Restore a backup</h3><p class="hint">Pick a backup file you saved from this app. It replaces everything here, including your bills, balances and spending.</p>
  <form><div class="field"><label for="file">Backup file</label><input type="file" id="file" name="file" accept=".json,application/json"></div>
  <p class="err" id="err" hidden style="color:var(--bad);margin:0;font-size:13px"></p>${actions("Replace everything")}</form>`,async (fd,f)=>{
    const err=m=>{const e=$("#err");e.textContent=m;e.hidden=false;};const file=F(f,"file").files&&F(f,"file").files[0];if(!file)return err("Choose a backup file first.");
    let data;try{data=JSON.parse(await file.text());}catch(e){return err("That file isn't a backup from this app. Pick a .json file you saved with Back up.");}
    if(!data||data.app!=="budget-tracker"||!data.settings)return err("That file isn't a backup from this app. Pick a .json file you saved with Back up.");
    const old=Object.keys(P);S=normSettings(data.settings);B=normBal(data.balances);P=data.periods&&typeof data.periods==="object"?data.periods:{};
    saveSettings();saveBal();for(const id of Object.keys(P))write("periods/"+id,P[id]);
    if(mode==="db")for(const id of old)if(!P[id])DB.doc("periods/"+id).delete().catch(()=>{});
    buildDates();ui.idx=CUR;closeSheet();render();toast("Backup restored");});
}
function setMode(m){if(S.budgetMode===m)return;S.budgetMode=m;if(m==="payoff"&&!(B.cardStart>=B.card)){B.cardStart=B.card;saveBal();}saveSettings();render();toast(m==="payoff"?"Card payoff mode on":"General budget mode on");}
function sheetBill(id){
  const b=id?S.bills.find(x=>x.id===id):{name:"",amount:"",day:1,variable:false};
  const opts=`<option value="each" ${b.day==="each"?"selected":""}>Every check</option>`+Array.from({length:31},(_,k)=>k+1).map(d=>`<option value="${d}" ${b.day===d?"selected":""}>${dayLabel(d)} of the month</option>`).join("");
  openSheet(`<h3>${id?"Edit bill":"Add bill"}</h3><form>
   <div class="field"><label for="name">Name</label><input id="name" name="name" value="${esc(b.name)}" placeholder="Rent" autocomplete="off"></div>
   <div class="grid2">${money("amount","Usual amount",b.amount===""?null:b.amount)}<div class="field"><label for="day">Charges on</label><select id="day" name="day">${opts}</select></div></div>
   <label style="display:flex;gap:10px;align-items:center;font-size:14px"><input type="checkbox" name="variable" style="width:auto" ${b.variable?"checked":""}> Amount varies month to month</label>
   <p class="err" id="err" hidden style="color:var(--bad);margin:0;font-size:13px"></p>
   ${actions(id?"Save":"Add",id?"Delete":null)}</form>`,fd=>{
    const name=String(fd.get("name")||"").trim();if(!name){const e=$("#err");e.textContent="Give the bill a name.";e.hidden=false;return;}
    const nb={id:id||uid(),name,amount:num(fd.get("amount")),day:fd.get("day")==="each"?"each":+fd.get("day"),variable:!!fd.get("variable")};
    S.bills=id?S.bills.map(x=>x.id===id?nb:x):[...S.bills,nb];saveSettings();closeSheet();render();toast(id?"Saved":"Bill added");},
  act=>{if(act==="del"){S.bills=S.bills.filter(x=>x.id!==id);saveSettings();closeSheet();render();toast("Bill deleted");}});
}

function sheetGuide(){
  openSheet(`<h3>How this app works</h3><div class="guide">
   <h4>The idea</h4><p>Every paycheck has a job. It covers the bills that charge before your next payday, then the rest goes where you've told it to. Whatever is left is free to spend, guilt-free.</p>
   <h4>Two budget modes</h4><p><b>General budget</b> splits each check into bills, savings and spending using your percentages, like 50/30/20. The credit card isn't part of the plan. <b>Card payoff</b> sends everything left after bills to an optional emergency buffer, then your credit card, until it's paid off, then goes back to your normal split. Switch in Setup any time.</p>
   <h4>Paycheck tab</h4><p>Shows one paycheck at a time; use the arrows to look back or ahead. The colored bar shows where every dollar goes. When the money lands, tap <b>My paycheck landed</b>, make each transfer in your bank app, then tick it off. Ticking updates the balances in this app; it never moves real money. Add bonuses or side money under <b>Extra income</b>.</p>
   <h4>Spending tab</h4><p>Log anything that isn't a bill and pick a category. <b>Where it went</b> breaks your spending down by category for the pay period or the month, warns you near any limits, and shows how you compare to last time.</p>
   <h4>${isPayoff()?"Card":"Savings"} tab</h4><p>${isPayoff()?"Your card balance, buffer and savings, a forecast of when the card hits $0, and your savings goals.":"Your savings balance and savings goals."} If a number drifts from your bank, tap Update and type the real one.</p>
   <h4>Setup tab</h4><p>Your mode, paycheck, split, bills, spending categories and limits, and color theme. You can also export your spending to a spreadsheet or back everything up.</p>
  </div><div class="row2" style="margin-top:16px"><button type="button" class="btn" data-sact="close">Got it</button></div>`);
}
// ---------- actions ----------
function toggleMove(k){
  const i=ui.idx;const p=per(i);if(!p.locked)return;const pl=plan(i,B);const mv={...(p.moves||{})};const amt=pl[k];const on=!mv[k];mv[k]=on;const sg=on?1:-1;
  if(k==="buffer"){B.buffer=r2(B.buffer+sg*amt);logBal("buffer",sg*amt,on?`Moved to buffer (${md(DATES[i])} check)`:"Undid buffer move");}
  if(k==="card"){B.card=r2(Math.max(0,B.card-sg*amt));logBal("payment",-sg*amt,on?`Card payment (${md(DATES[i])} check)`:"Undid card payment");}
  if(k==="savings"){B.savings=r2(B.savings+sg*amt);logBal("savings",sg*amt,on?`Moved to savings (${md(DATES[i])} check)`:"Undid savings move");}
  P[pid(i)]={...p,moves:mv};savePer(i);saveBal();render();
}
document.addEventListener("click",e=>{
  const sc=e.target.closest("#scrim");
  if(sc){if(e.target.id==="scrim"){closeSheet();return;}const sa=e.target.closest("[data-sact]");if(sa){if(sa.dataset.sact==="close")closeSheet();else if(sheet&&sheet.onClick)sheet.onClick(sa.dataset.sact);}return;}
  const tb=e.target.closest("[data-tab]");if(tb){ui.tab=tb.dataset.tab;try{history.replaceState(null,"","#"+ui.tab);}catch(_){}window.scrollTo(0,0);render();return;}
  const a=e.target.closest("[data-act]");if(!a||a.disabled)return;
  if(readOnly&&!["prev","next","help","guide","introok","accent","mode","sview","exportcsv","backup"].includes(a.dataset.act)){toast("You can view this budget but not change it.");return;}
  const act=a.dataset.act;
  if(act==="prev"){ui.idx=Math.max(0,ui.idx-1);render();}
  else if(act==="next"){ui.idx=Math.min(DATES.length-2,ui.idx+1);render();}
  else if(act==="landed")sheetLanded();
  else if(act==="adjust")sheetAdjust();
  else if(act==="move")toggleMove(a.dataset.k);
  else if(act==="billpaid"){const i=ui.idx,p=per(i),id=a.dataset.id;const cur=(p.bills||{})[id]||{};P[pid(i)]={...p,bills:{...(p.bills||{}),[id]:{...cur,paid:!cur.paid}}};savePer(i);render();}
  else if(act==="billamt")sheetBillAmt(a.dataset.id);
  else if(act==="addtx")sheetTx(null);
  else if(act==="edittx")sheetTx(a.dataset.id);
  else if(act==="cover"){const i=ui.idx,amt=num(a.dataset.amt);B.card=r2(Math.max(0,B.card-amt));logBal("payment",-amt,"Covered card purchases");P[pid(i)]={...per(i),coverPaid:r2((per(i).coverPaid||0)+amt)};savePer(i);saveBal();render();toast(`Logged ${fmt(amt,true)} card payment`);}
  else if(act==="setbal")sheetBal(a.dataset.k);
  else if(act==="help"){const k=a.dataset.k;openHelp.has(k)?openHelp.delete(k):openHelp.add(k);render();}
  else if(act==="introok"){introDone=true;try{localStorage.setItem(INTRO,"1");}catch(_){}render();}
  else if(act==="guide")sheetGuide();
  else if(act==="accent")setLook({accent:a.dataset.v});
  else if(act==="mode")setLook({mode:a.dataset.v});
  else if(act==="editpay")sheetPay();
  else if(act==="editsplit")sheetSplit();
  else if(act==="editbill")sheetBill(a.dataset.id||null);
  else if(act==="setmode")setMode(a.dataset.v);
  else if(act==="sview"){ui.sview=a.dataset.v;render();}
  else if(act==="editpayoff")sheetPayoff();
  else if(act==="editcat")sheetCat(a.dataset.id||null);
  else if(act==="editgoal")sheetGoal(a.dataset.id||null);
  else if(act==="goaladd")sheetGoalAdd(a.dataset.id);
  else if(act==="addinc")sheetIncome(null);
  else if(act==="editinc")sheetIncome(a.dataset.id);
  else if(act==="exportcsv")exportCsv();
  else if(act==="backup")backup();
  else if(act==="restore")sheetRestore();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet)closeSheet();});
let tt;function toast(m){$("#toastroot").innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>{$("#toastroot").innerHTML="";},2600);}

render();boot();
})();
</script>

</body></html>
