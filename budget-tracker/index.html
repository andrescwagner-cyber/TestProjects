<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Andres Budget Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column; each paycheck is a cheque stub split into five envelopes (bills, buffer, card, savings, free), with a checklist of what to move when it lands. */
:root{
  --bg:#eef2ed; --surface:#ffffff; --sunk:#e4eae3; --ink:#15221d; --muted:#5d6c65; --line:#d3dcd2;
  --accent:#1d5c47; --accent-ink:#ffffff;
  --c-bills:#56646e; --c-buffer:#b8841a; --c-card:#c2463a; --c-save:#2d8a5d; --c-free:#3a6db3;
  --warn:#a8650e; --bad:#b83a2e; --good:#25784f;
  /* spending categories: fixed slots, validated for colorblind separation on each surface */
  --k1:#2a78d6; --k2:#eb6834; --k3:#1baf7a; --k4:#eda100; --k5:#e87ba4; --k6:#008300; --k7:#6250d6; --k8:#e34948; --k0:#97a09b;
  --display:"Bricolage Grotesque", "Avenir Next", ui-sans-serif, system-ui, sans-serif;
  --body:"Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#161e1b; --sunk:#1d2723; --ink:#e5ebe6; --muted:#93a29b; --line:#27322d;
  --accent:#72c9a3; --accent-ink:#0b1310;
  --c-bills:#a2b2bd; --c-buffer:#e2b14e; --c-card:#ee7a6a; --c-save:#66c592; --c-free:#7ea8e6;
  --warn:#e4a64a; --bad:#ef7b6b; --good:#66c592; color-scheme:dark;
  --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500; --k5:#d55181; --k6:#008300; --k7:#9085e9; --k8:#e66767; --k0:#5f6b66;
}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161e1b; --sunk:#1d2723; --ink:#e5ebe6; --muted:#93a29b; --line:#27322d;
  --accent:#72c9a3; --accent-ink:#0b1310;
  --c-bills:#a2b2bd; --c-buffer:#e2b14e; --c-card:#ee7a6a; --c-save:#66c592; --c-free:#7ea8e6;
  --warn:#e4a64a; --bad:#ef7b6b; --good:#66c592; color-scheme:dark;
  --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500; --k5:#d55181; --k6:#008300; --k7:#9085e9; --k8:#e66767; --k0:#5f6b66;
}
/* Color themes: each swaps the accent (hero, buttons, active states) with its own light and dark value. */
:root[data-accent="ocean"]{--accent:#1f4f8a}
:root[data-accent="plum"]{--accent:#5a3577}
:root[data-accent="ember"]{--accent:#9a3d12}
:root[data-accent="graphite"]{--accent:#2b3036}
:root[data-accent="rose"]{--accent:#8f2f52}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-accent="ocean"]{--accent:#84aee8}
  :root:not([data-theme="light"])[data-accent="plum"]{--accent:#c7a3e3}
  :root:not([data-theme="light"])[data-accent="ember"]{--accent:#f19366}
  :root:not([data-theme="light"])[data-accent="graphite"]{--accent:#c9d1d8}
  :root:not([data-theme="light"])[data-accent="rose"]{--accent:#f08fb3}
}
:root[data-theme="dark"][data-accent="ocean"]{--accent:#84aee8}
:root[data-theme="dark"][data-accent="plum"]{--accent:#c7a3e3}
:root[data-theme="dark"][data-accent="ember"]{--accent:#f19366}
:root[data-theme="dark"][data-accent="graphite"]{--accent:#c9d1d8}
:root[data-theme="dark"][data-accent="rose"]{--accent:#f08fb3}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swatch{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;font-size:14px;min-width:0}
.swatch i{width:22px;height:22px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--swl) 50%,var(--swd) 50%)}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
@media (max-width:380px){.swatches{grid-template-columns:repeat(2,1fr)}}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding-block:0 120px;display:flex;flex-direction:column;gap:14px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);padding-block:12px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
header.top .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
.save{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.tabs button{border-radius:9px;padding:8px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.pnav{display:flex;align-items:center;gap:10px}
.pnav .mid{flex:1;min-width:0;text-align:center}
.pnav h2{font-family:var(--display);font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.pnav small{display:block;color:var(--muted);font-size:13px}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.arrow svg{width:16px;height:16px}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);vertical-align:middle;margin-left:6px}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:18px}
.hero .lab{font-size:13px;font-weight:600;opacity:.85}
.big{font-family:var(--display);font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 10px}
.big .c{font-size:26px;letter-spacing:-.01em}
.hero .sub{font-size:14px;opacity:.9}
.hero .track{height:6px;border-radius:9px;background:color-mix(in srgb,var(--accent-ink) 25%,transparent);margin-top:12px;overflow:hidden}
.hero .track i{display:block;height:100%;background:var(--accent-ink);border-radius:9px}
.hero.neg .big{text-decoration:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font-family:var(--display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.card .hint{font-size:13px;color:var(--muted);margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}

/* the cheque stub */
.stub{border-top:2px dashed var(--line);padding-top:14px;margin-top:-2px}
.stubhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.stubhead .amt{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em}
.micr{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.strip{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);gap:2px}
.strip i{display:block;height:100%;min-width:0}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.legend div{display:flex;flex-direction:column;gap:1px;min-width:0}
.legend span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dot)}
.legend b{font-weight:700;font-size:14px}
.legend em{font-style:normal;font-size:11.5px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.note.warn{color:var(--ink);background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.note.bad{color:var(--ink);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}

/* checklist */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:2px}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;border:1.5px solid var(--dot,var(--muted));color:var(--dot,var(--muted))}
.step .t{min-width:0}
.step .t b{display:block;font-weight:600}
.step .t small{color:var(--muted);font-size:12.5px}
.step .v{font-weight:700;text-align:right}
.step.zero .t b,.step.zero .v{color:var(--muted);font-weight:500}
.tick{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.tick svg{width:16px;height:16px;opacity:0}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.tick[aria-pressed="true"] svg{opacity:1}
.tick:disabled{opacity:.4;cursor:default}
.step.done .t b{text-decoration:line-through;text-decoration-color:var(--muted)}
.bills{margin:4px 0 0 40px;display:flex;flex-direction:column;border-left:2px solid var(--line);padding-left:12px}
.bill{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.bill .tick{width:22px;height:22px;border-radius:6px}
.bill .tick svg{width:13px;height:13px}
.bill .nm{min-width:0}
.bill .nm small{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:6px}
.bill button.amt{font-weight:600;border-bottom:1px dashed var(--muted)}
.bill.paid .nm{color:var(--muted);text-decoration:line-through}

.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:12px 16px;text-align:center}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .btn{flex:1}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px}

.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv div:first-child{border-top:0;padding-top:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}

.meter{height:10px;border-radius:9px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px}

.tx{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left;align-items:center}
.tx:first-of-type{border-top:0}
.tx b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{color:var(--muted);font-size:12.5px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1px solid currentColor;margin-left:6px}
.tag.card{color:var(--c-card)} .tag.debit{color:var(--muted)}
.wk{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px 0}

/* help: a "?" next to a heading opens a plain-language explanation right under it */
.info{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font:700 12px/1 var(--body);display:inline-grid;place-items:center;color:var(--muted);vertical-align:2px;margin-left:6px;flex:none;letter-spacing:0;text-transform:none}
.info:hover{color:var(--ink)}
.info[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.hero .info{color:var(--accent-ink);opacity:.9}
.hero .info[aria-expanded="true"]{background:var(--accent-ink);color:var(--accent);opacity:1}
.helpbox{margin:0;font-size:13.5px;line-height:1.5;padding:10px 12px;border-radius:10px;background:var(--sunk);color:var(--ink);border-left:3px solid var(--accent);font-weight:400;text-transform:none;letter-spacing:0}
.helpbox b{font-weight:700}
.hero .helpbox{background:color-mix(in srgb,var(--accent-ink) 14%,transparent);color:var(--accent-ink);border-left-color:var(--accent-ink);margin-top:12px}
.step .helpbox{grid-column:1/-1}
.intro ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.intro ol li::marker{font-family:var(--mono);color:var(--muted)}
.guide h4{font-family:var(--display);font-size:16px;margin:14px 0 4px}
.guide p{margin:0 0 6px;font-size:14px;line-height:1.55}
/* mode picker, segmented control, category breakdown, history bars */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modeopt{text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}
.modeopt b{font-family:var(--display);font-size:16px;font-weight:700}
.modeopt small{color:var(--muted);font-size:12.5px;line-height:1.4}
.modeopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
@media (max-width:380px){.modes{grid-template-columns:1fr}}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border-radius:8px;padding:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.brk{display:flex;flex-direction:column;gap:14px}
.catr{display:flex;flex-direction:column;gap:5px;min-width:0}
.catr .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14.5px}
.catr .top b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catr .top .num{font-weight:700;white-space:nowrap}
.catr small{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.up{color:var(--bad);font-weight:600}.down{color:var(--good);font-weight:600}
.st-over{color:var(--bad);font-weight:700}.st-close{color:var(--warn);font-weight:700}
.hist{display:grid;grid-template-columns:auto 1fr auto;gap:7px 10px;align-items:center;font-size:13px}
.hist .bar{height:8px;border-radius:5px;background:var(--sunk);overflow:hidden}
.hist .bar i{display:block;height:100%;background:var(--c-free);border-radius:5px}
.hist .cur{font-weight:700;color:var(--ink)}
.hist span{color:var(--muted)}
.tag.cat{color:var(--muted);border:0;padding:0;margin-left:8px;display:inline-flex;align-items:center;gap:5px;font-size:11px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none;background:var(--c)}
.catr .top b{display:flex;align-items:center;gap:8px}
.catstrip{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:var(--sunk)}
.catstrip i{display:block;height:100%;min-width:3px;background:var(--c)}
.chips button .dot{margin-right:7px;vertical-align:0}
.chips button[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent-ink)}
.colorpick{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.colorpick button{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.colorpick button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.filebtn{display:flex;flex-direction:column;gap:6px}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:340px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
tr.hit td{color:var(--good);font-weight:700}

.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:99px;padding:14px 20px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9;display:flex;gap:8px;align-items:center}
.fab svg{width:18px;height:18px}

.scrim{position:fixed;inset:0;background:rgba(5,12,9,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:540px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:12px 16px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-family:var(--display);font-size:21px;font-weight:800;margin:8px 0 4px;letter-spacing:-.01em}
.sheet p.hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.sheet form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:12.5px;color:var(--muted);margin:0}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
.money{position:relative}
.money::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money input{padding-left:24px}
.money.big input{font-family:var(--display);font-size:34px;font-weight:800;padding:12px 12px 12px 32px}
.money.big::before{font-size:24px;left:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:380px){.big{font-size:46px}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.7}to{transform:none;opacity:1}}}
</style>

<header class="top"><div class="in">
  <div class="brand"><h1>Budget Tracker</h1><div style="display:flex;gap:8px;align-items:center"><span class="save" id="savestate">Loading</span><button class="info" data-act="guide" aria-label="How this app works" title="How this app works">?</button></div></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<main id="app"><p class="loading">Loading your paychecks, bills and card balance…</p></main>
<button class="fab" id="fab" hidden data-act="addtx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add spending</button>
<div id="sheetroot"></div>
<div id="toastroot"></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const sum=a=>r2(a.reduce((t,x)=>t+(+x||0),0));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,9);
function fmt(n,cents){const neg=n<0;const a=Math.abs(r2(n));const c=cents??(a%1!==0);return(neg?"−$":"$")+a.toLocaleString("en-US",{minimumFractionDigits:c?2:0,maximumFractionDigits:c?2:0});}
function bigMoney(n){const neg=n<0,a=Math.abs(r2(n));const d=Math.floor(a).toLocaleString("en-US");const c=String(Math.round((a%1)*100)).padStart(2,"0");return `${neg?"−":""}$${d}<span class="c">.${c}</span>`;}
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const ld=(y,m)=>new Date(y,m+1,0).getDate();
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const md=d=>`${MON[d.getMonth()]} ${d.getDate()}`;
const dmd=d=>`${DOW[d.getDay()]}, ${md(d)}`;
const ord=n=>n+(["th","st","nd","rd"][(n%100-20)%10]||["th","st","nd","rd"][n%100]||"th");
const dayLabel=d=>d==="each"?"Every check":d>=31?"Last day":ord(d);
const ICON={
  l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'
};

// ---------- help text ----------
const HELP={
  free:"Money from this paycheck that isn't spoken for. It's what's left after bills, your buffer, the card and savings, minus anything you've logged in Spending. The per-day number spreads it evenly over the days until your next payday.",
  planned:"What this future check should leave you to spend, based on your bills and where your buffer and card balance will be by then. It updates as things change.",
  cover:"When you buy something with the credit card using your free money, the cash for it is still sitting in checking. Sending that amount to the card right away keeps the balance from creeping back up.",
  split:()=>"Where every dollar of this paycheck goes. <b>Bills</b> are the ones that charge before your next payday. "+(isPayoff()?(S.useBuffer!==false?"<b>Buffer</b> is emergency cash. ":"")+"<b>Card</b> is your credit card payment. ":"")+"<b>Savings</b> is long-term money. <b>Free</b> is yours to spend. The % under each is its share of this check.",
  steps:"Your to-do list for this paycheck. When the money hits your account, tap <b>My paycheck landed</b> to confirm the amount. Then make each move in your bank app and tick it here. Ticking updates your buffer, card and savings balances in this app; it doesn't move real money.",
  bills:"Every bill that charges between this payday and the next. Leave this much in checking. Tick each one when it actually charges. Tap an amount to change it for this month only, for example when electric comes in higher.",
  buffer:"A cushion of cash, kept separate, for surprises like a car repair, so they never go on the credit card. Until it reaches your target, money left after bills fills it first. Don't want a buffer? Turn it off in Setup, under Split.",
  card:"How much to pay toward the credit card from this check. Once the buffer is full, everything left after bills goes here until the balance is $0.",
  savings:()=>isPayoff()?"Long-term savings. Your savings % kicks in once the card is paid off"+(S.useBuffer!==false?" and the buffer is full.":"."):`Your ${S.split.savings}% for long-term savings. Move it to your savings account when the check lands.`,
  freestep:"What's left for everything that isn't a bill: eating out, gas, fun. Log purchases in the Spending tab to see it count down.",
  spendsum:()=>"<b>Free money</b> is what this check left you to spend, plus any extra income you chose to spend. "+(isPayoff()?"<b>Debit spent</b> and <b>Card spent</b> are what you've logged, split by how you paid. ":"<b>Spent</b> is what you've logged. ")+"<b>Left</b> is what you can still spend before the next payday.",
  spendlist:()=>"Every purchase you've logged for this pay period, grouped by week, with its category. Tap one to edit or delete it."+(isPayoff()?" Card purchases are also added to your card balance.":""),
  cardbal:"What you owe on the credit card. Payments you tick on the Paycheck tab lower it, and card purchases you log raise it. If it doesn't match your card app (interest, refunds, a missed purchase), tap <b>Update card balance</b> and type the real number.",
  bufferbox:"Your emergency cushion. The goal is to never put a surprise expense on the card. If you use some of it, update the balance and the app will refill it from your next checks.",
  savingsbox:"Long-term savings you've moved over from paychecks. Update it any time to match your bank.",
  payoff:"A forecast, one row per paycheck, assuming your bills stay the same and you cover any new card purchases. <b>Buffer</b> and <b>Card pmt</b> are what that check sends to each. <b>Card after</b> is the balance after that payment. The highlighted row is when the card hits $0. A ✓ means you've already entered that check.",
  activity:"A history of everything that changed your balances: card payments, card purchases, buffer and savings moves, and manual updates.",
  paycheck:"Your usual take-home pay per check and the days you're paid. If a check is different, you can change that one when it lands.",
  splitset:()=>"How each paycheck divides between bills, spending and savings. <b>Bills</b> is a target that flags checks where bills run high; your real bills are always paid in full. <b>Savings</b> comes out of each check when there's room. <b>Spending</b> is whatever is left. Tap Edit for quick presets like 50/30/20 or to fine-tune with sliders."+(isPayoff()?" While you're paying off the card, this split waits and takes over once the card is done.":""),
  payoffset:"Settings that only apply in Card payoff mode. <b>Emergency buffer</b> is a cash cushion filled before extra card payments; turn it off to send that money straight to the card. <b>Order</b> picks which fills first. <b>Keep free per check</b> is spending money you hold back from each check while paying off.",
  mode:"Pick how the app plans each paycheck. <b>General budget</b> splits it into bills, savings and spending and leaves the credit card out of it. <b>Card payoff</b> sends everything after bills to an optional emergency buffer, then the card, until it's paid off, then switches to your normal split. Switch any time; nothing is lost.",
  modegen:"You're in General budget mode. Each check pays its bills, puts your savings % aside, and the rest is free to spend. The credit card isn't part of the plan. Switch to Card payoff in Setup if you want to focus on paying down a card.",
  modepay:"You're in Card payoff mode. Everything left after bills goes to your buffer and card until both are done. The bars show how far along you are, and the dates are when each should be done if your bills stay the same.",
  breakdown:"Where your non-bill spending went, by category, biggest first. The striped bar at the top shows each category's share, in its color. Switch between this pay period and the whole month. If a category has a limit, you'll see ● when you're close and ⚠ when you're over. The arrows show the change from the previous period or month. Change a category's color in Setup.",
  history:"Your total non-bill spending for each of the last six pay periods or months, so you can spot trends. The current one is in bold.",
  income:()=>"Money outside your regular paychecks, like a bonus, side job or refund. Choose what it's for: <b>Spend it</b> adds it to this period's free money, <b>Save it</b> adds it to your savings balance"+(isPayoff()?", and <b>Pay the card</b> lowers your card balance.":"."),
  goals:"Things you're saving for, like a vacation or an emergency fund. Goals are slices of your savings. Add money from savings you already have, or new money, which also raises your savings balance.",
  catsset:"The categories you pick from when you log spending. Tap one to rename it, change its color, or set a limit per pay period. Deleting a category keeps its purchases; they show as Uncategorized.",
  data:()=>"<b>Export spending</b> downloads your purchases and extra income as a CSV that opens in Excel or Google Sheets. <b>Back up</b> saves everything to a file you can restore later. "+(mode==="db"?"This copy saves to your Claude account.":"This copy saves on this device only, so back up now and then, especially before switching phones."),
  billsset:"Your recurring bills and the day each one charges. Each bill is paid from the paycheck that lands before its charge date. Twice-a-month costs, like groceries, work best as two bills.",
  balances:()=>isPayoff()?"The current amounts in your credit card, buffer and savings. Set these to match your bank and card apps whenever they drift.":"Your current savings balance. Set it to match your bank whenever it drifts."
};
const openHelp=new Set();
const info=k=>`<button class="info" data-act="help" data-k="${k}" aria-expanded="${openHelp.has(k)}" aria-label="What does this mean?" title="What does this mean?">?</button>`;
const helpBox=k=>{if(!openHelp.has(k))return "";const v=HELP[k];return `<p class="helpbox">${typeof v==="function"?v():v}</p>`;};
const INTRO="andres-budget-intro-done";
let introDone=false;try{introDone=localStorage.getItem(INTRO)==="1";}catch(e){}

// ---------- state ----------
const DEFAULT_CATS=()=>[["dining","Dining out"],["groc","Groceries (extra)"],["gas","Gas & transport"],["shop","Shopping"],["fun","Entertainment"],["subs","Subscriptions"],["care","Personal care"],["home","Household"],["gifts","Gifts"],["other","Other"]].map(([id,name])=>({id,name,limit:0}));
const CAT_SLOT={dining:1,subs:2,groc:3,gas:4,fun:5,home:6,shop:7,care:8,gifts:0,other:0};
function nextSlot(cats){const used=new Set(cats.map(c=>c.color).filter(v=>Number.isInteger(v)&&v>0));for(let k=1;k<=8;k++)if(!used.has(k))return k;return 0;}
const catColor=id=>{const c=S.cats.find(c=>c.id===id);return `var(--k${c&&Number.isInteger(c.color)?c.color:0})`;};
const dot=id=>`<i class="dot" style="--c:${catColor(id)}" aria-hidden="true"></i>`;
const PRESETS=[[50,20,"50/30/20"],[60,20,"60/20/20"],[70,10,"70/20/10"]];
const BASE_SETTINGS={budgetMode:"general",payAmount:0,payDays:[15,31],split:{bills:50,savings:20},bufferTarget:1000,useBuffer:true,order:"buffer",keepFree:0,bills:[],cats:null,goals:[]};
// ---------- look (color theme + light/dark) ----------
const ACCENTS=[["bank","Bank green","#1d5c47","#72c9a3"],["ocean","Ocean","#1f4f8a","#84aee8"],["plum","Plum","#5a3577","#c7a3e3"],["ember","Ember","#9a3d12","#f19366"],["graphite","Graphite","#2b3036","#c9d1d8"],["rose","Rose","#8f2f52","#f08fb3"]];
const LOOK="andres-budget-look";const hostTheme=document.documentElement.getAttribute("data-theme");
let look={accent:"bank",mode:"system"};
try{look={...look,...JSON.parse(localStorage.getItem(LOOK)||"{}")};}catch(e){}
function applyLook(){const r=document.documentElement;
  if(look.accent&&look.accent!=="bank")r.setAttribute("data-accent",look.accent);else r.removeAttribute("data-accent");
  if(look.mode==="light"||look.mode==="dark")r.setAttribute("data-theme",look.mode);else if(hostTheme)r.setAttribute("data-theme",hostTheme);else r.removeAttribute("data-theme");}
applyLook();
function setLook(patch){look={...look,...patch};applyLook();try{localStorage.setItem(LOOK,JSON.stringify(look));}catch(e){}S.look={...look};saveSettings();render();}
const isPayoff=()=>S.budgetMode==="payoff";
const bufT=()=>(!isPayoff()||S.useBuffer===false)?0:(+S.bufferTarget||0);
const payoffOn=bal=>isPayoff()&&(r2(bufT()-bal.buffer)>0.004||bal.card>0.004);
let S=normSettings(null), B=normBal(null), P={};
let mode="loading", DB=null, loaded={s:false,b:false,p:false}, pending=0, readOnly=false;
let DATES=[], CUR=0;
const TABS=[["plan","Paycheck"],["spend","Spending"],["card","Card"],["setup","Setup"]];
const tabLabel=k=>k==="card"?(isPayoff()?"Card":"Savings"):TABS.find(t=>t[0]===k)[1];
let ui={tab:(TABS.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):"plan"),idx:null,sview:"period"};

function normSettings(o){const raw=o||{};const s={...clone(BASE_SETTINGS),...clone(raw)};
  // Older saves had a payoff on/off flag instead of a mode.
  if(raw.budgetMode!=="general"&&raw.budgetMode!=="payoff")s.budgetMode=(raw.payAmount&&raw.payoffMode!==false)?"payoff":"general";
  delete s.payoffMode;
  s.cats=(Array.isArray(raw.cats)&&raw.cats.length?raw.cats:DEFAULT_CATS()).map(c=>({id:String(c.id||uid()),name:String(c.name||"Category"),limit:Math.max(0,+c.limit||0),color:c.color}));
  // Give each category a color slot: presets have fixed ones; others take the next free slot, then neutral.
  s.cats.forEach(c=>{if(Number.isInteger(c.color)&&c.color>=0&&c.color<=8)return;c.color=CAT_SLOT[c.id]!=null?CAT_SLOT[c.id]:nextSlot(s.cats);});
  s.goals=(Array.isArray(raw.goals)?raw.goals:[]).map(g=>({id:String(g.id||uid()),name:String(g.name||"Goal"),target:Math.max(0,+g.target||0)}));
  s.split={...BASE_SETTINGS.split,...(s.split||{})};s.bills=(s.bills||[]).map(b=>({id:b.id||uid(),name:b.name||"Bill",amount:+b.amount||0,day:b.day==="each"?"each":Math.min(31,Math.max(1,+b.day||1)),variable:!!b.variable}));s.payDays=(s.payDays&&s.payDays.length?s.payDays:[15,31]).map(Number).sort((a,b)=>a-b);return s;}
function normBal(o){const b={buffer:0,card:0,savings:0,log:[],...clone(o||{})};b.buffer=r2(b.buffer);b.card=r2(b.card);b.savings=r2(b.savings);b.log=Array.isArray(b.log)?b.log:[];b.goals=b.goals&&typeof b.goals==="object"&&!Array.isArray(b.goals)?b.goals:{};b.cardStart=r2(b.cardStart!=null?b.cardStart:b.card);return b;}

function buildDates(){
  const t=new Date();const out=[];
  for(let k=-8;k<=26;k++){const base=new Date(t.getFullYear(),t.getMonth()+k,1);const y=base.getFullYear(),m=base.getMonth();
    [...new Set(S.payDays.map(d=>Math.min(d,ld(y,m))))].sort((a,b)=>a-b).forEach(d=>out.push(new Date(y,m,d)));}
  DATES=out;const ti=iso(t);CUR=0;DATES.forEach((d,i)=>{if(iso(d)<=ti)CUR=i;});
  if(ui.idx==null||ui.idx<0||ui.idx>=DATES.length-1)ui.idx=CUR;
}
const pid=i=>"p"+iso(DATES[i]);
const per=i=>P[pid(i)]||{};
function idxForDate(d){let k=0;DATES.forEach((x,i)=>{if(x<=d)k=i;});return k;}

function billsFor(i){
  const a=DATES[i],b=DATES[i+1];const res=[];
  S.bills.forEach(bl=>{
    if(bl.day==="each"){res.push({...bl,due:a});return;}
    for(const dd of [a,b]){const y=dd.getFullYear(),m=dd.getMonth();const due=new Date(y,m,Math.min(bl.day,ld(y,m)));
      if(due>=a&&due<b&&!res.some(r=>r.id===bl.id))res.push({...bl,due});}
  });
  return res.sort((x,y)=>x.due-y.due);
}
function billLines(i){const p=per(i);return billsFor(i).map(bl=>{const o=(p.bills||{})[bl.id]||{};return{...bl,amt:o.amt!=null?r2(o.amt):bl.amount,paid:!!o.paid};});}

function plan(i,bal){
  const p=per(i);const pay=r2(p.amount!=null?p.amount:S.payAmount);const lines=billLines(i);const billsTotal=sum(lines.map(l=>l.amt));const left=r2(pay-billsTotal);
  let b,c,s,save;
  if(p.locked){b=r2(p.locked.buffer);c=r2(p.locked.card);s=r2(p.locked.savings);save=r2(b+c+s);}
  else{const need=Math.max(0,r2(bufT()-bal.buffer));const owe=isPayoff()?Math.max(0,r2(bal.card)):0;const keep=Math.max(0,+S.keepFree||0);
    // Payoff mode: everything after bills (minus the free-money allowance) fills the buffer, then the card. Normal mode: the savings % does.
    const pool=payoffOn(bal)?Math.floor(Math.max(0,left-keep)):Math.floor(Math.min(pay*S.split.savings/100,Math.max(0,left)));
    if(S.order==="card"){c=Math.min(pool,owe);b=Math.min(r2(pool-c),need);}else{b=Math.min(pool,need);c=Math.min(r2(pool-b),owe);}
    b=r2(b);c=r2(c);
    if(payoffOn(bal)){const done=r2(need+owe-b-c)<=0.004;s=done?Math.floor(Math.min(pay*S.split.savings/100,Math.max(0,left-b-c-keep))):0;}
    else s=r2(pool-b-c);
    save=r2(b+c+s);}
  return{pay,lines,billsTotal,left,save,buffer:b,card:c,savings:s,fun:r2(left-save),locked:!!p.locked};
}
function spentOf(i){const tx=per(i).tx||[];const card=sum(tx.filter(t=>t.method==="card").map(t=>t.amount));const debit=sum(tx.filter(t=>t.method!=="card").map(t=>t.amount));return{card,debit,total:r2(card+debit),covered:r2(per(i).coverPaid||0)};}

const USE={spend:"Added to free money",save:"Moved to savings",card:"Paid toward the card"};
function extraOf(i){const inc=per(i).income||[];const by=u=>sum(inc.filter(x=>x.use===u).map(x=>x.amount));return{list:inc,spend:by("spend"),save:by("save"),card:by("card"),total:sum(inc.map(x=>x.amount))};}
function allTx(){const out=[];for(const p of Object.values(P))for(const t of (p.tx||[]))out.push(t);return out;}
const catName=id=>{const c=S.cats.find(c=>c.id===id);return c?c.name:"Uncategorized";};
const catKey=t=>S.cats.some(c=>c.id===t.cat)?t.cat:"_none";

// Walk forward from the current check, applying planned moves to simulated balances.
function projection(n){
  const sim={buffer:B.buffer,card:B.card,savings:B.savings};const rows=[];const before={};
  for(let i=CUR;i<Math.min(CUR+n,DATES.length-1);i++){
    before[i]={...sim};const p=per(i);const pl=plan(i,sim);const mv=p.moves||{};
    const db=p.locked&&mv.buffer?0:pl.buffer, dc=p.locked&&mv.card?0:pl.card, ds=p.locked&&mv.savings?0:pl.savings;
    sim.buffer=r2(sim.buffer+db);sim.card=r2(Math.max(0,sim.card-dc));sim.savings=r2(sim.savings+ds);
    rows.push({i,pl,after:{...sim}});
  }
  return{rows,before};
}
function planShown(i){if(per(i).locked||i<=CUR)return plan(i,B);const pr=projection(i-CUR+1);return plan(i,pr.before[i]||B);}

// ---------- persistence ----------
const LS="andres-budget-v1";
let chains={};
function setSave(){const el=$("#savestate");if(!el)return;el.textContent=mode==="loading"?"Loading":mode==="local"?"Saved on this device":readOnly?"View only":pending?"Saving…":"Saved";}
function write(path,data){
  if(mode==="local"){try{localStorage.setItem(LS,JSON.stringify({settings:S,balances:B,periods:P}));}catch(e){}setSave();return;}
  if(mode!=="db"||readOnly)return;
  pending++;setSave();
  const prev=chains[path]||Promise.resolve();
  chains[path]=prev.then(()=>DB.doc(path).set(clone(data))).catch(e=>{
    if(e&&e.code==="invalid_argument"){readOnly=true;toast("You can view this budget but not change it.");}
    else toast("Couldn't save that change. Check your connection and try again.");
  }).finally(()=>{pending--;setSave();});
}
const saveSettings=()=>write("budget/settings",S);
const saveBal=()=>write("budget/balances",B);
const savePer=i=>{const id=pid(i);P[id]={date:iso(DATES[i]),...(P[id]||{})};write("periods/"+id,P[id]);};
function logBal(kind,amt,note){B.log.unshift({t:Date.now(),kind,amt:r2(amt),note:note||"",card:B.card,buffer:B.buffer});B.log=B.log.slice(0,80);}

function startLocal(){
  if(mode!=="loading")return;mode="local";
  try{const v=JSON.parse(localStorage.getItem(LS)||"null");if(v){S=normSettings(v.settings);B=normBal(v.balances);P=v.periods||{};}}catch(e){}
  buildDates();render();
}
async function boot(){
  const fallback=setTimeout(startLocal,11000);
  if(!window.claude||typeof window.claude.use!=="function"){clearTimeout(fallback);startLocal();return;}
  let db=null;try{[db]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);}catch(e){}
  clearTimeout(fallback);
  if(!db){startLocal();return;}
  if(mode!=="loading")return;
  DB=db;mode="db";
  const go=()=>{if(loaded.s&&loaded.b&&loaded.p){buildDates();render();}};
  const err=()=>{toast("Lost the connection to your saved budget. Reload to reconnect.");};
  db.doc("budget/settings").onSnapshot(s=>{S=normSettings(s.exists?s.data():null);if(S.look){look={...look,...S.look};applyLook();try{localStorage.setItem(LOOK,JSON.stringify(look));}catch(e){}}loaded.s=true;go();},err);
  db.doc("budget/balances").onSnapshot(s=>{B=normBal(s.exists?s.data():null);loaded.b=true;go();},err);
  db.collection("periods").onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=clone(d.data());});P=o;loaded.p=true;go();},err);
}

// ---------- render ----------
function render(){
  $("#tabs").innerHTML=TABS.map(([k])=>`<button data-tab="${k}" ${ui.tab===k?'aria-current="page"':""}>${tabLabel(k)}</button>`).join("");
  setSave();
  if(mode==="loading")return;
  const views={plan:vPlan,spend:vSpend,card:vCard,setup:vSetup};
  const y=window.scrollY;
  $("#app").innerHTML=(setupNeeded()&&ui.tab!=="setup"?setupBanner():"")+views[ui.tab]();
  window.scrollTo(0,y);
  $("#fab").hidden=!(ui.tab==="plan"||ui.tab==="spend")||setupNeeded();
}
const setupNeeded=()=>!S.payAmount;
function modePicker(){return `<div class="modes" role="group" aria-label="Budget mode">
 <button class="modeopt" data-act="setmode" data-v="general" aria-pressed="${!isPayoff()}"><b>General budget</b><small>Split each check into bills, savings and spending. No credit card focus.</small></button>
 <button class="modeopt" data-act="setmode" data-v="payoff" aria-pressed="${isPayoff()}"><b>Card payoff</b><small>Everything after bills goes to an emergency buffer, then your credit card, until it's $0.</small></button></div>`;}
function setupBanner(){return `<section class="card"><h3>Let's set up your budget</h3><p class="hint">First, pick how you want each paycheck planned. You can change this any time in Setup.</p>${modePicker()}<p class="hint">Then add your take-home pay and your bills. Everything else is worked out from those.</p><div class="row2"><button class="btn" data-act="editpay">Add your paycheck</button><button class="btn ghost" data-tab="setup">Go to Setup</button></div></section>`;}

function pnav(){
  const i=ui.idx,a=DATES[i],b=new Date(DATES[i+1]-864e5);const p=per(i);
  const st=i===CUR?(p.locked?'<span class="pill on">Current</span>':'<span class="pill warn">Not entered</span>'):i===CUR+1?'<span class="pill">Next up</span>':i>CUR?'<span class="pill">Upcoming</span>':(p.locked?'<span class="pill">Past</span>':'<span class="pill">Past</span>');
  return `<div class="pnav"><button class="arrow" data-act="prev" aria-label="Previous paycheck" ${i<=0?"disabled":""}>${ICON.l}</button>
  <div class="mid"><h2>Check of ${dmd(a)}${st}</h2><small>Covers ${md(a)} – ${md(b)}</small></div>
  <button class="arrow" data-act="next" aria-label="Next paycheck" ${i>=DATES.length-2?"disabled":""}>${ICON.r}</button></div>`;
}
function daysLeft(i){const end=DATES[i+1];const t=new Date();t.setHours(0,0,0,0);return Math.max(1,Math.round((end-t)/864e5));}

function modeSummary(){
  if(!isPayoff()){const sp=Math.max(0,100-S.split.bills-S.split.savings);
    return `<section class="card"><div class="stubhead"><p class="eyebrow">General budget${info("modegen")}</p><button class="linkbtn" data-tab="setup">Change</button></div>${helpBox("modegen")}
    <div class="legend">${[["Bills",S.split.bills,"--c-bills"],["Spending",sp,"--c-free"],["Savings",S.split.savings,"--c-save"]].map(([n,v,c])=>`<div style="--dot:var(${c})"><span>${n}</span><b class="num">${v}%</b></div>`).join("")}</div></section>`;}
  const pr=projection(30);const when=test=>{const r=pr.rows.find(r=>test(r.after));return r?md(DATES[r.i]):null;};
  const bt=bufT();const dCard=B.card>0.004?when(a=>a.card<=0.004):null;const dBuf=bt>0&&B.buffer<bt-0.004?when(a=>a.buffer>=bt-0.004):null;
  const start=Math.max(B.cardStart||0,B.card);const cPct=start>0?Math.max(0,Math.min(100,(start-B.card)/start*100)):100;
  const allDone=B.card<=0.004&&(bt<=0||B.buffer>=bt-0.004);
  const head=allDone?"You did it. The card is paid off"+(bt>0?" and your buffer is full":"")+", so paychecks now follow your normal split."
    :B.card<=0.004?`Card's paid off. Finishing your buffer${dBuf?` by ${dBuf}`:""}.`
    :`${fmt(B.card,true)} left on the card${dCard?`, paid off by ${dCard}`:""}.`;
  const row=(label,val,pct,color,sub)=>`<div class="catr"><div class="top"><b>${label}</b><span class="num">${val}</span></div><div class="meter"><i style="width:${pct}%;background:var(${color})"></i></div><small><span>${sub}</span></small></div>`;
  return `<section class="card"><div class="stubhead"><p class="eyebrow">Card payoff mode${info("modepay")}</p><button class="linkbtn" data-tab="setup">Change</button></div>${helpBox("modepay")}
   <h3>${head}</h3><div class="brk">
   ${bt>0?row("Emergency buffer",`${fmt(B.buffer)} of ${fmt(bt)}`,Math.min(100,B.buffer/bt*100),"--c-buffer",B.buffer>=bt-0.004?"Full":dBuf?`Full with your ${dBuf} check`:"Not full within a year at this pace"):""}
   ${row("Credit card",B.card<=0.004?"Paid off":`${fmt(B.card,true)} left`,cPct,"--c-card",B.card<=0.004?"Keep it at $0 by covering card purchases each period":`${Math.round(cPct)}% paid off${dCard?` · done with your ${dCard} check`:" · not done within a year at this pace"}`)}
   </div></section>`;
}

function vPlan(){
  const i=ui.idx;const pl=planShown(i);const p=per(i);const sp=spentOf(i);const ex=extraOf(i);const mv=p.moves||{};
  const pay=isPayoff();const bufOn=pay&&S.useBuffer!==false;
  let h=pnav();
  if(!introDone&&!setupNeeded())h=`<section class="card intro"><h3>How this works</h3><ol>
   <li>Each paycheck pays the bills that charge before your next payday.</li>
   <li>${pay?`What's left ${bufOn?"fills your buffer (emergency cash), then pays":"pays"} down the credit card. Once that's done, it goes to savings.`:`Then ${S.split.savings}% goes to savings, and the rest is yours to spend.`}</li>
   <li>When a check lands, tap <b>My paycheck landed</b>, make the moves in your bank app, and tick them off here.</li>
   <li>Log purchases with <b>Add spending</b> and pick a category to see where your money goes.</li></ol>
   <p class="hint">Tap any <b>?</b> for what a section means.</p><div class="row2"><button class="btn sm" data-act="introok">Got it</button><button class="btn ghost sm" data-act="guide">Full guide</button></div></section>`+h;
  const fun=r2(pl.fun+ex.spend);
  // hero
  if(i<=CUR){
    const free=r2(fun-sp.total);const pct=fun>0?Math.min(100,sp.total/fun*100):(sp.total>0?100:0);
    const sub=i===CUR?(free>0?`${fmt(r2(free/daysLeft(i)),true)} a day for the next ${daysLeft(i)} day${daysLeft(i)>1?"s":""}`:free<0?`Over by ${fmt(-free,true)}. It'll come out of your next check.`:`Nothing free until ${md(DATES[i+1])}.`):`Spent ${fmt(sp.total,true)} of ${fmt(fun,true)}`;
    h+=`<section class="hero"><div class="lab">${i===CUR?`Free to spend until ${md(DATES[i+1])}`:"Left unspent this period"}${info("free")}</div><div class="big num">${bigMoney(free)}</div><div class="sub">${sub}</div>${i===CUR?`<div class="sub" style="opacity:.75;margin-top:2px">Spent ${fmt(sp.total,true)} of ${fmt(fun,true)}${ex.spend?` (includes ${fmt(ex.spend,true)} extra income)`:""}</div>`:""}<div class="track"><i style="width:${pct}%"></i></div>${helpBox("free")}</section>`;
  }else{
    h+=`<section class="hero"><div class="lab">Planned free money from this check${info("planned")}</div><div class="big num">${bigMoney(fun)}</div><div class="sub">Lands ${dmd(DATES[i])}.${pay?" Numbers assume no new card spending before then.":""}</div>${helpBox("planned")}</section>`;
  }
  if(!setupNeeded())h+=modeSummary();
  // card cover prompt (payoff mode only)
  const owed=r2(sp.card-sp.covered);
  if(pay&&i<=CUR&&owed>0.004)h+=`<section class="card"><h3>Cover this period's card purchases${info("cover")}</h3>${helpBox("cover")}<p class="hint">You put ${fmt(sp.card,true)} on the card from your free money${sp.covered?`, and already sent ${fmt(sp.covered,true)}`:""}. The cash is still in checking, so send it to the card to keep the balance from growing.</p><button class="btn" data-act="cover" data-amt="${owed}">Pay ${fmt(owed,true)} to the card</button></section>`;
  // stub
  const segs=[["Bills",pl.billsTotal,"--c-bills"],["Buffer",pl.buffer,"--c-buffer"],["Card",pl.card,"--c-card"],["Savings",pl.savings,"--c-save"],["Free",Math.max(0,pl.fun),"--c-free"]].filter(s=>(s[0]!=="Buffer"||bufOn)&&(s[0]!=="Card"||pay));
  const tot=Math.max(pl.pay,pl.billsTotal,1);const billPct=pl.pay?Math.round(pl.billsTotal/pl.pay*100):0;
  let target;
  if(pl.left<0)target=`<p class="note bad">Bills due before your next check are ${fmt(-pl.left,true)} more than this paycheck. ${bufOn?"Cover the gap from your buffer, then refill it next check.":"Set aside money from your other check to cover the gap."}</p>`;
  else if(billPct>S.split.bills)target=`<p class="note warn">Bills take ${billPct}% of this check, over your ${S.split.bills}% target. That's normal for the check that pays rent; your other check does the saving.</p>`;
  else target=pay?`<p class="note">Bills take ${billPct}% of this check (target ${S.split.bills}%).</p>`:`<p class="note">Bills take ${billPct}% of this check (target ${S.split.bills}%). ${S.split.savings}% goes to savings when there's room, and the rest is yours to spend.</p>`;
  if(pay&&!pl.locked&&pl.left>0&&payoffOn(i<=CUR?B:(projection(i-CUR+1).before[i]||B)))target+=`<p class="note">Payoff mode: everything left after bills${S.keepFree?` except ${fmt(S.keepFree)} to spend`:""} goes to ${bufOn?"your buffer, then the card":"the card"}. Your ${S.split.savings}% savings split starts once ${bufOn?"both are":"it's"} done.</p>`;
  h+=`<section class="card"><div class="stubhead"><div><p class="eyebrow">Paycheck${pl.locked?"":" (expected)"}${info("split")}</p><div class="amt num">${fmt(pl.pay,true)}</div></div><span class="micr">CHK ${iso(DATES[i]).replaceAll("-","")} · ${pl.locked?"LANDED":"PLANNED"}</span></div>
  <div class="strip" role="img" aria-label="How this paycheck splits">${segs.filter(s=>s[1]>0).map(s=>`<i style="width:${s[1]/tot*100}%;background:var(${s[2]})"></i>`).join("")}</div>
  ${helpBox("split")}<div class="legend">${segs.map(s=>`<div style="--dot:var(${s[2]})"><span>${s[0]}</span><b class="num">${fmt(s[1],true)}</b><em>${pl.pay?Math.round(s[1]/pl.pay*100):0}%</em></div>`).join("")}</div>${target}</section>`;
  // checklist
  const lk=pl.locked;
  const step=(n,key,label,amt,sub,color,hk)=>{const zero=amt<=0.004;const on=!!mv[key];
    return `<div class="step${zero?" zero":""}${on?" done":""}" style="--dot:var(${color})"><span class="n">${n}</span><div class="t"><b>${label}${hk?info(hk):""}</b><small>${sub}</small></div>
    <div class="row2" style="align-items:center;gap:10px;flex-wrap:nowrap"><span class="v num">${fmt(amt,true)}</span>${key&&!zero?`<button class="tick" data-act="move" data-k="${key}" aria-pressed="${on}" aria-label="Mark done" ${lk?"":"disabled"}>${ICON.ok}</button>`:'<span style="width:28px"></span>'}</div>${hk?helpBox(hk):""}</div>`;};
  const billRows=pl.lines.length?`<div class="bills">${pl.lines.map(l=>`<div class="bill${l.paid?" paid":""}"><button class="tick" data-act="billpaid" data-id="${l.id}" aria-pressed="${l.paid}" aria-label="Mark ${esc(l.name)} paid">${ICON.ok}</button><span class="nm">${esc(l.name)}<small>${l.day==="each"?"this check":DOW[l.due.getDay()]+" "+md(l.due)}</small></span><button class="amt num" data-act="billamt" data-id="${l.id}" aria-label="Change ${esc(l.name)} amount">${fmt(l.amt,true)}</button></div>`).join("")}</div>`:"";
  const before=i<=CUR?B:(projection(i-CUR+1).before[i]||B);
  const afterCard=Math.max(0,r2(before.card-(mv.card?0:pl.card)));
  const bufNow=before.buffer;
  let sn=1;
  h+=`<section class="card"><div class="stubhead"><h3>${lk?"Do these in order":"When this check lands"}${info("steps")}</h3>${lk?`<button class="linkbtn" data-act="adjust">Adjust</button>`:""}</div>${helpBox("steps")}
  <div class="steps">
   <div>${step(sn++,null,`Keep ${fmt(pl.billsTotal,true)} for bills`,pl.billsTotal,`${pl.lines.length} due before ${md(DATES[i+1])}. Tick each when it charges.`,"--c-bills","bills")}${billRows}</div>
   ${bufOn?step(sn++,"buffer","Move to your buffer",pl.buffer,pl.buffer>0?`Buffer ${fmt(bufNow)} of ${fmt(bufT())}`:bufNow>=bufT()?"Buffer is full":"Nothing this check","--c-buffer","buffer"):""}
   ${pay?step(sn++,"card","Pay the credit card",pl.card,pl.card>0?`Balance after: ${fmt(afterCard,true)}`:before.card<=0.004?"Card is paid off":"Nothing this check","--c-card","card"):""}
   ${step(sn++,"savings","Move to savings",pl.savings,pl.savings>0?(pay?"Long-term savings":`${S.split.savings}% of this check`):pay&&before.card>0.004?"Starts once the card is paid off":"Nothing this check","--c-save","savings")}
   ${step(sn++,null,"Keep the rest to spend",Math.max(0,pl.fun),"Your free money until the next check","--c-free","freestep")}
  </div>
  ${lk?"":`<button class="btn" data-act="landed" ${i>CUR+1?"disabled style=\"opacity:.5\"":""}>My paycheck landed</button>${i>CUR+1?`<p class="hint">You can enter this check once it's the next one up.</p>`:`<p class="hint">Confirm the amount and these moves get locked in, so you can tick them off.</p>`}`}
  </section>`;
  // extra income
  if(i<=CUR+1)h+=`<section class="card"><div class="stubhead"><h3>Extra income${info("income")}</h3><button class="linkbtn" data-act="addinc">Add</button></div>${helpBox("income")}
   ${ex.list.length?`<div class="kv">${ex.list.map(x=>`<div><button style="text-align:left;flex:1" data-act="editinc" data-id="${x.id}"><b>${esc(x.note||"Extra income")}</b><br><small style="color:var(--muted)">${md(fromIso(x.date))} · ${USE[x.use]||""}</small></button><b class="num">+${fmt(x.amount,true)}</b></div>`).join("")}</div>`
   :`<p class="hint">Got a bonus, side money or a refund? Add it here and choose whether to spend it, save it${pay?" or put it on the card":""}.</p>`}</section>`;
  return h;
}

function checksInMonth(ym){return DATES.filter(d=>iso(d).startsWith(ym)).length||S.payDays.length;}
function breakdown(i){
  const monthly=ui.sview==="month";const all=allTx();
  let cur,prev,label,prevLabel,mult=1,hist=[];
  if(monthly){
    const d=DATES[i];const ym=iso(d).slice(0,7);const pd=new Date(d.getFullYear(),d.getMonth()-1,1);const pym=iso(pd).slice(0,7);
    cur=all.filter(t=>t.date.startsWith(ym));prev=all.filter(t=>t.date.startsWith(pym));
    label=`in ${MON[d.getMonth()]}`;prevLabel=MON[pd.getMonth()];mult=checksInMonth(ym);
    for(let k=5;k>=0;k--){const hd=new Date(d.getFullYear(),d.getMonth()-k,1);const hym=iso(hd).slice(0,7);hist.push({label:`${MON[hd.getMonth()]}${hd.getMonth()===0||k===5?" "+String(hd.getFullYear()).slice(2):""}`,total:sum(all.filter(t=>t.date.startsWith(hym)).map(t=>t.amount)),cur:k===0});}
  }else{
    cur=per(i).tx||[];prev=i>0?(per(i-1).tx||[]):[];label="this pay period";prevLabel="last period";
    for(let k=Math.max(0,i-5);k<=i;k++)hist.push({label:md(DATES[k]),total:sum((per(k).tx||[]).map(t=>t.amount)),cur:k===i});
  }
  const byCat=list=>{const o={};list.forEach(x=>{const k=catKey(x);o[k]=r2((o[k]||0)+x.amount);});return o;};
  const a=byCat(cur),b=byCat(prev);const total=sum(cur.map(t=>t.amount)),ptotal=sum(prev.map(t=>t.amount));
  const keys=[...S.cats.map(c=>c.id),"_none"].filter(k=>(a[k]||0)>0||((S.cats.find(c=>c.id===k)||{}).limit>0));
  keys.sort((x,y)=>(a[y]||0)-(a[x]||0));
  const maxAmt=Math.max(1,...keys.map(k=>a[k]||0));
  const delta=(d,has)=>!has?"":Math.abs(d)<1?`Same as ${prevLabel}`:d>0?`<span class="up">▲ ${fmt(d)}</span> vs ${prevLabel}`:`<span class="down">▼ ${fmt(-d)}</span> vs ${prevLabel}`;
  const rows=keys.map(k=>{
    const c=S.cats.find(c=>c.id===k);const amt=a[k]||0;const lim=c&&c.limit?r2(c.limit*mult):0;const pct=lim?amt/lim*100:amt/maxAmt*100;
    const st=lim?(amt>lim?["st-over",`Over by ${fmt(r2(amt-lim))}`]:pct>=80?["st-close",`${fmt(r2(lim-amt))} left of ${fmt(lim)}`]:["",`${fmt(r2(lim-amt))} left of ${fmt(lim)}`]):["",""];
    const flag=st[0]==="st-over"?"⚠ ":st[0]==="st-close"?"● ":"";
    return `<div class="catr"><div class="top"><b>${dot(k)}${esc(catName(k))}</b><span class="num">${fmt(amt,true)}${total>0&&amt>0?` <span style="color:var(--muted);font-weight:500">${Math.round(amt/total*100)}%</span>`:""}</span></div><div class="meter"><i style="width:${Math.min(100,pct)}%;background:${catColor(k)}"></i></div><small><span class="${st[0]}">${flag}${st[1]}</span><span>${delta(r2(amt-(b[k]||0)),prev.length>0)}</span></small></div>`;}).join("");
  const strip=total>0?`<div class="catstrip" role="img" aria-label="Share of spending by category">${keys.filter(k=>(a[k]||0)>0).map(k=>`<i style="width:${a[k]/total*100}%;--c:${catColor(k)}" title="${esc(catName(k))}: ${fmt(a[k],true)} (${Math.round(a[k]/total*100)}%)"></i>`).join("")}</div>`:"";
  const maxH=Math.max(1,...hist.map(r=>r.total));
  return `<section class="card"><h3>Where it went${info("breakdown")}</h3>${helpBox("breakdown")}
   <div class="seg" role="group" aria-label="Show spending for"><button data-act="sview" data-v="period" aria-pressed="${!monthly}">Pay period</button><button data-act="sview" data-v="month" aria-pressed="${monthly}">Month</button></div>
   <p class="hint" style="margin:0">Spent ${label}: <b class="num" style="color:var(--ink)">${fmt(total,true)}</b>${prev.length?` · ${delta(r2(total-ptotal),true)}`:""}</p>
   ${strip}${rows?`<div class="brk">${rows}</div>`:`<p class="empty">Nothing logged ${label} yet.</p>`}
   ${monthly&&S.cats.some(c=>c.limit)?`<p class="hint">Limits are set per pay period, so the month view uses ${mult}× each limit.</p>`:""}
   <p class="eyebrow" style="margin-top:6px">Last 6 ${monthly?"months":"pay periods"}${info("history")}</p>${helpBox("history")}
   <div class="hist">${hist.map(r=>`<span class="${r.cur?"cur":""}">${r.label}</span><div class="bar"><i style="width:${r.total/maxH*100}%"></i></div><span class="num ${r.cur?"cur":""}">${fmt(r.total)}</span>`).join("")}</div>
  </section>`;
}

function vSpend(){
  const i=ui.idx;const pl=planShown(i);const sp=spentOf(i);const ex=extraOf(i);const pay=isPayoff();const free=r2(pl.fun+ex.spend);
  const tx=(per(i).tx||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.t-a.t);
  let h=pnav();
  h+=`<section class="card"><div class="stubhead"><h3>This pay period${info("spendsum")}</h3><button class="linkbtn" data-act="addinc">+ Extra income</button></div>${helpBox("spendsum")}<div class="legend">
   <div style="--dot:var(--c-free)"><span>Free money</span><b class="num">${fmt(free,true)}</b></div>
   ${pay?`<div style="--dot:var(--c-bills)"><span>Debit spent</span><b class="num">${fmt(sp.debit,true)}</b></div>
   <div style="--dot:var(--c-card)"><span>Card spent</span><b class="num">${fmt(sp.card,true)}</b></div>`:`<div style="--dot:var(--c-bills)"><span>Spent</span><b class="num">${fmt(sp.total,true)}</b></div>`}
   <div style="--dot:var(--accent)"><span>Left</span><b class="num">${fmt(r2(free-sp.total),true)}</b></div></div>
   <div class="meter"><i style="width:${free>0?Math.min(100,sp.total/free*100):0}%;background:${sp.total>free?"var(--bad)":"var(--c-free)"}"></i></div>
   ${pay&&r2(sp.card-sp.covered)>0.004?`<div class="row2" style="align-items:center"><p class="hint" style="flex:2">${fmt(r2(sp.card-sp.covered),true)} on the card isn't covered yet.</p><button class="btn sm" data-act="cover" data-amt="${r2(sp.card-sp.covered)}">Pay it</button></div>`:""}</section>`;
  h+=breakdown(i);
  h+=`<section class="card"><h3>Spending this period${info("spendlist")}</h3>${helpBox("spendlist")}`;
  if(!tx.length)h+=`<p class="empty">No spending logged yet. Tap Add spending each time you buy something outside your bills.</p>`;
  else{
    let wk="";tx.forEach(t=>{const d=fromIso(t.date);const ws=new Date(d);ws.setDate(d.getDate()-d.getDay());const k=iso(ws);
      if(k!==wk){wk=k;const wsum=sum(tx.filter(x=>{const xd=fromIso(x.date);const xs=new Date(xd);xs.setDate(xd.getDate()-xd.getDay());return iso(xs)===k;}).map(x=>x.amount));h+=`<div class="wk"><span>Week of ${md(ws)}</span><span class="num">${fmt(wsum,true)}</span></div>`;}
      h+=`<button class="tx" data-act="edittx" data-id="${t.id}"><span><b style="display:flex;align-items:center;gap:8px">${dot(catKey(t))}${esc(t.note||catName(t.cat))}</b><small>${dmd(d)}${t.note?`<span class="tag cat">${esc(catName(t.cat))}</span>`:""}${pay&&t.method==="card"?'<span class="tag card">Card</span>':""}</small></span><span class="num" style="font-weight:700">${fmt(t.amount,true)}</span></button>`;});
  }
  return h+`</section>`;
}

function goalsCard(){
  const assigned=sum(S.goals.map(g=>B.goals[g.id]||0));const over=assigned>B.savings+0.004;
  return `<section class="card"><div class="stubhead"><h3>Savings goals${info("goals")}</h3><button class="linkbtn" data-act="editgoal">Add goal</button></div>${helpBox("goals")}
  ${S.goals.length?`<div class="brk">${S.goals.map(g=>{const sv=B.goals[g.id]||0;const pct=g.target?Math.min(100,sv/g.target*100):0;
    return `<div class="catr"><div class="top"><button data-act="editgoal" data-id="${g.id}" style="font-weight:600;text-align:left;min-width:0">${esc(g.name)}</button><span class="num">${fmt(sv,true)} <span style="color:var(--muted);font-weight:500">of ${fmt(g.target)}</span></span></div><div class="meter"><i style="width:${pct}%;background:var(--c-save)"></i></div><small><span>${g.target&&sv>=g.target?"Goal reached":`${fmt(r2(Math.max(0,g.target-sv)))} to go`}</span><button class="linkbtn" data-act="goaladd" data-id="${g.id}">Add money</button></small></div>`;}).join("")}</div>
  <p class="${over?"note warn":"hint"}" style="margin:0">${fmt(assigned,true)} of your ${fmt(B.savings,true)} savings is set aside for goals.${over?" That's more than your savings balance shows. Update the balance or adjust a goal.":""}</p>`
  :`<p class="empty">No goals yet. Add one, like Vacation or Emergency fund, and watch it fill up.</p>`}</section>`;
}
function activityCard(){const log=B.log.slice(0,15);

   <p class="hint">${B.buffer>=S.bufferTarget?"Full. Surprise bills come out of here, not the card.":`Until this is full, ${S.order==="card"?"the card gets paid first, then the buffer fills.":"money left after bills fills this first, then goes to the card."} You can change the order in Setup.`}</p></section>`;
  h+=`<section class="card"><div class="stubhead"><h3>Savings${info("savingsbox")}</h3><button class="linkbtn" data-act="setbal" data-k="savings">Update</button></div>${helpBox("savingsbox")}<span class="amt num" style="font-family:var(--display);font-size:24px;font-weight:800">${fmt(B.savings,true)}</span></section>`;
  h+=goalsCard();
  const rows=[];for(const r of pr.rows){rows.push(r);if(r.after.card<=0&&r.after.buffer>=bufT()&&rows.length>=4)break;if(rows.length>=14)break;}
  h+=`<section class="card"><h3>Payoff schedule${info("payoff")}</h3>${helpBox("payoff")}<p class="hint">Each paycheck from now, assuming your bills stay the same and you cover any new card purchases.</p>

   </tbody></table></div></section>`;
  return h+activityCard();
}

   <div><span>Keep free per check while paying off</span><b class="num">${fmt(S.keepFree||0)}</b></div></div></section>`;
  h+=`<section class="card"><div class="stubhead"><h3>Bills${info("billsset")}</h3><button class="linkbtn" data-act="editbill">Add bill</button></div>${helpBox("billsset")}

   <div><span>Monthly total</span><b class="num">${fmt(sum(S.bills.map(b=>b.day==="each"?b.amount*S.payDays.length:b.amount)),true)}</b></div></div>`:`<p class="empty">No bills yet. Add rent, utilities, loans and anything that charges on a set day.</p>`}
   <p class="hint">Each bill is paid from the paycheck that lands before its charge date. Split twice-a-month costs like groceries into two bills.</p></section>
  <section class="card"><div class="stubhead"><h3>Spending categories${info("catsset")}</h3><button class="linkbtn" data-act="editcat">Add</button></div>${helpBox("catsset")}

   <div class="swatches">${ACCENTS.map(([k,n,l,d])=>`<button class="swatch" data-act="accent" data-v="${k}" aria-pressed="${look.accent===k}" style="--swl:${l};--swd:${d}"><i></i>${n}</button>`).join("")}</div>
   <div class="chips">${[["system","Match device"],["light","Light"],["dark","Dark"]].map(([k,n])=>`<button data-act="mode" data-v="${k}" aria-pressed="${look.mode===k}">${n}</button>`).join("")}</div></section>
  <section class="card"><h3>Balances${info("balances")}</h3>${helpBox("balances")}<div class="kv">${pay?`<div><span>Credit card</span><b class="num">${fmt(B.card,true)}</b></div>`:""}${pay&&S.useBuffer!==false?`<div><span>Buffer</span><b class="num">${fmt(B.buffer,true)}</b></div>`:""}<div><span>Savings</span><b class="num">${fmt(B.savings,true)}</b></div></div>
   <div class="row2">${pay?`<button class="btn ghost sm" data-act="setbal" data-k="card">Card</button>`:""}${pay&&S.useBuffer!==false?`<button class="btn ghost sm" data-act="setbal" data-k="buffer">Buffer</button>`:""}<button class="btn ghost sm" data-act="setbal" data-k="savings">Savings</button></div></section>
  <section class="card"><h3>Your data${info("data")}</h3>${helpBox("data")}

  return h;

const num=v=>r2(parseFloat(String(v).replace(/[$,]/g,""))||0);
const money=(id,label,val,extra)=>`<div class="field"><label for="${id}">${label}</label><div class="money${extra?" big":""}"><input id="${id}" name="${id}" inputmode="decimal" value="${val!=null?r2(val):""}" autocomplete="off"></div></div>`;

const F=(f,n)=>f.querySelector(`[name="${n}"]`);
const fval=(f,k)=>F(f,k)?num(F(f,k).value):0;
function sheetLanded(){
  const i=ui.idx;
  const calc=amt=>{const id=pid(i);const orig=P[id];P[id]={...(orig||{}),amount:amt};const pl=plan(i,B);if(orig)P[id]=orig;else delete P[id];return pl;};
  const pl=planShown(i);
  openSheet(`<h3>Paycheck for ${dmd(DATES[i])}</h3><p class="hint">Enter what actually hit your account. The moves below update to match; change any of them if you want.</p>
  <form>${money("pay","Amount that landed",pl.pay,true)}${moveFields(pl)}
   <p class="note" id="leftnote"></p>${actions("Lock it in")}</form>`,fd=>{
     const amt=num(fd.get("pay"));const lockv={buffer:num(fd.get("buffer")),card:num(fd.get("card")),savings:num(fd.get("savings"))};
     P[pid(i)]={...per(i),amount:amt,locked:lockv,moves:per(i).moves||{}};savePer(i);closeSheet();render();toast("Paycheck locked in. Tick off each move as you make it.");});
  const f=$("#sheetroot form");let touched=false;
  const upd=()=>{const amt=num(F(f,"pay").value);const bt=billLines(i).reduce((t,l)=>t+l.amt,0);const fun=r2(amt-bt-fval(f,"buffer")-fval(f,"card")-fval(f,"savings"));
    $("#leftnote").textContent=`Bills ${fmt(r2(bt),true)} · free to spend ${fmt(fun,true)}`;$("#leftnote").className="note"+(fun<0?" bad":"");};
  F(f,"pay").addEventListener("input",()=>{if(!touched){const c=calc(num(F(f,"pay").value));["buffer","card","savings"].forEach(k=>{if(F(f,k))F(f,k).value=c[k];});}upd();});
  ["buffer","card","savings"].forEach(k=>{if(F(f,k))F(f,k).addEventListener("input",()=>{touched=true;upd();});});upd();
}
function sheetAdjust(){
  const i=ui.idx;const p=per(i);const pl=plan(i,B);const mv=p.moves||{};const anyDone=mv.buffer||mv.card||mv.savings;
  openSheet(`<h3>Adjust this check</h3><p class="hint">${anyDone?"Moves you've already ticked are locked. Untick one to change it.":"Change the amount or any move."}</p>
  <form>${money("pay","Paycheck amount",pl.pay)}${moveFields(pl)}
  ${actions("Save",anyDone?null:"Unlock")}</form>`,fd=>{
    const nv={buffer:num(fd.get("buffer")),card:num(fd.get("card")),savings:num(fd.get("savings"))};
    for(const k of ["buffer","card","savings"])if(mv[k])nv[k]=pl[k];

function sheetTx(id){
  let found=null,fi=null;if(id)DATES.forEach((d,i)=>{const t=(per(i).tx||[]).find(x=>x.id===id);if(t){found=t;fi=i;}});
  const pay=isPayoff();
  const t=found||{amount:"",note:"",method:"debit",date:iso(new Date()),cat:""};let method=pay?t.method:"debit";let cat=S.cats.some(c=>c.id===t.cat)?t.cat:"";
  openSheet(`<h3>${found?"Edit spending":"Add spending"}</h3><p class="hint">Anything outside your bills.${pay?" Card purchases also get added to your card balance.":""}</p>

   <div class="field"><span class="flabel">Category</span><div class="chips" id="cats">${S.cats.map(c=>`<button type="button" data-c="${c.id}" aria-pressed="${c.id===cat}">${dot(c.id)}${esc(c.name)}</button>`).join("")}<button type="button" data-c="_new" aria-pressed="false">+ New</button></div>

   ${pay?`<div class="field"><span class="flabel">Paid with</span><div class="chips" id="meth"><button type="button" data-m="debit" aria-pressed="${method!=="card"}">Debit or cash</button><button type="button" data-m="card" aria-pressed="${method==="card"}">Credit card</button></div></div>`:""}
   <div class="field"><label for="date">Date</label><input id="date" name="date" type="date" value="${t.date}"></div>
   <p class="err" id="err" hidden style="color:var(--bad);margin:0;font-size:13px"></p>
   ${actions(found?"Save":"Add",found?"Delete":null)}</form>`,fd=>{
    const amount=num(fd.get("amount"));const date=fd.get("date")||iso(new Date());const err=m=>{const e=$("#err");e.textContent=m;e.hidden=false;};
    if(amount<=0)return err("Enter an amount above $0.");
    if(cat==="_new"){const nm=String(fd.get("newcat")||"").trim();if(!nm)return err("Type a name for the new category.");
      const ex=S.cats.find(c=>c.name.toLowerCase()===nm.toLowerCase());if(ex)cat=ex.id;else{const nc={id:uid(),name:nm,limit:0,color:nextSlot(S.cats)};S.cats=[...S.cats,nc];cat=nc.id;saveSettings();}}
